<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230d1210'/%3E%3Ctext x='90' y='120' font-size='84' font-family='monospace' font-weight='700' fill='%2333c76e' text-anchor='middle'%3E%C2%B0C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>いまの気温</title>
<style>
  :root{
    --ink:#0d1210; --panel:#161d1a; --line:#2b3733;
    --text:#dfe6e1; --muted:#7e8d86;
    --green:#33c76e; --amber:#e8b230; --blue:#6fb3d9; --red:#d9634a;
    --ja:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    --num:"Roboto","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",monospace;
    --mono:var(--num);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);
    font-family:var(--ja);font-feature-settings:"palt" 1;font-variant-numeric:tabular-nums;
    -webkit-text-size-adjust:100%}
  body{padding:calc(14px + env(safe-area-inset-top)) 12px 48px;max-width:540px;margin:0 auto}


  /* オードメーター */
  .odo{display:inline-flex;align-items:baseline;line-height:1}
  .odo .slot{display:inline-block;overflow:hidden;position:relative;
    vertical-align:baseline;min-width:.62em}
  .odo .strip{display:flex;flex-direction:column;will-change:transform}
  .odo .strip>span{display:block;text-align:center}
  .odo .fixed{display:inline-block;text-align:center}
  .banner{border-radius:9px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.6;display:none}
  .banner b{display:block;font-size:15px;margin-bottom:3px}
  .banner.hot{background:#3a2a12;border:1px solid #7a5a20;color:#f5d489}
  .banner.cold{background:#12283a;border:1px solid #2a5a7a;color:#a9d4ef}
  .banner.dead{background:#3a1f1a;border:1px solid #7a3a32;color:#f3c4bb}

  .now{text-align:center;margin-bottom:12px}
  .big{font-size:72px;font-weight:700;font-family:var(--num);line-height:1;color:var(--green);
    display:inline-flex;align-items:baseline;justify-content:center}
  .big.stale{color:var(--muted)}
  .big.hot{color:var(--amber)} .big.cold{color:var(--blue)}
  .unit{font-size:26px;margin-left:6px;color:var(--muted)}
  .trend{font-size:13px;color:var(--muted);font-family:var(--mono);margin-top:6px}
  .sub{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono)}

  .cards{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .c{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 14px;min-width:100px}
  .c .k{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:4px}
  .c b{font-family:var(--num);font-size:20px;font-weight:700;
    display:inline-flex;align-items:baseline;justify-content:center}

  #chart{width:100%;height:150px;display:block;margin:10px 0 18px}

  table{width:100%;border-collapse:collapse;font-family:var(--num)}
  thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);
    font-size:11px;font-weight:600;padding:9px 4px;line-height:1.3;border-bottom:1px solid var(--line)}
  thead th.corner{color:var(--text);font-size:13px}
  tbody th{font-weight:400;color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
  tbody td{text-align:center;font-size:16px;padding:8px 4px;font-weight:700}
  tbody tr:nth-child(odd){background:rgba(255,255,255,.025)}
  tbody tr.ten{background:rgba(51,199,110,.16)}
  tbody tr.ten th{color:var(--green)}
  tbody tr.ten td{font-weight:700}
  tbody tr:first-child{box-shadow:inset 3px 0 0 var(--green)}
  .hi{color:var(--amber)} .lo{color:var(--blue)}
  tbody tr.gap td{text-align:center;color:var(--red);font-size:12px;font-weight:700;
    background:rgba(217,99,74,.12);padding:5px 4px}
  .msg{color:var(--muted);font-size:14px;text-align:center;padding:50px 0;line-height:1.8}
  .err{color:var(--red);font-size:12px;word-break:break-all;margin:8px 0}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:14px}
  .panel .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
  .panel input{width:100%;background:#0b0f0d;color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:10px;font-family:var(--mono);font-size:13px}
  .th{display:flex;gap:8px;align-items:center}
  .th input{text-align:center}
  .th span{font-size:12px;color:var(--muted);white-space:nowrap}
  button{margin-top:9px;width:100%;background:#20302a;color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:11px;font-size:14px;font-weight:600}
  button.go{background:var(--green);border-color:var(--green);color:#fff}
  .foot{text-align:center;margin-top:20px;font-size:11px;color:var(--muted)}
  .foot a{color:var(--muted);margin:0 8px}
</style>
</head>
<body>

<div id="setup" class="panel" style="display:none">
  <div class="lbl">接続先</div>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url">
  <button class="go" id="save">表示する</button>
</div>

<div id="settings" class="panel" style="display:none">
  <div class="lbl">アラートのしきい値（空欄で無効）</div>
  <div class="th">
    <span>これ以上</span><input id="hi" inputmode="decimal" placeholder="35.0">
    <span>これ以下</span><input id="lo" inputmode="decimal" placeholder="20.0">
  </div>
  <div class="lbl" style="margin-top:12px">記録が止まったとみなす時間（分・0で無効）</div>
  <input id="deadMin" inputmode="numeric" placeholder="5">
  <div class="lbl" style="margin-top:12px">画面の更新間隔（秒）</div>
  <input id="pollSec" inputmode="numeric" placeholder="5">
  <div class="lbl" style="margin-top:12px">
    <label style="display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px">
      <input type="checkbox" id="odoOn" style="width:auto"> 数字を回して表示する
    </label>
  </div>
  <button id="notify">通知を許可する</button>
  <button class="go" id="saveSet">保存</button>
</div>

<div id="alert" class="banner"></div>
<div id="now" class="now"></div>
<canvas id="chart"></canvas>
<div id="table"></div>
<div id="app"></div>

<div id="remote" class="panel" style="display:none">
  <div class="lbl">遠隔で校正</div>
  <button class="go" id="refreshSnap">今の画像を取得</button>
  <img id="snap" alt="" style="width:100%;border-radius:7px;background:#000;display:none;margin-top:10px">
  <div id="snapAt" style="font-size:11px;color:var(--muted);font-family:var(--mono);margin:6px 0 10px"></div>
  <div id="calBox" style="display:none">
    <div class="lbl">この画像に写っている数字を入力</div>
    <input id="calVal" inputmode="decimal" placeholder="例 34.3">
    <button class="go" id="sendCal">この値で校正させる</button>
  </div>
  <div id="cmdState" style="font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6"></div>
</div>

<div class="foot">
  <a href="#" id="openRemote">遠隔で校正</a>
  <a href="#" id="openSet">アラート設定</a>
  <a href="#" id="change">接続先を変更</a>
</div>

<script>
const $ = id => document.getElementById(id);
// 応答が返らないまま固まるのを防ぐ
function fetchTimeout(url, opts, ms){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const o=Object.assign({}, opts||{});
  if(ac) o.signal=ac.signal;
  const t=setTimeout(()=>{ if(ac) ac.abort(); }, ms||15000);
  return fetch(url,o).finally(()=>clearTimeout(t));
}
const K_URL='templogger:viewUrl', K_SET='templogger:alerts';

let cfg = { hi:null, lo:null, deadMin:5, pollSec:5, odo:true };
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(K_SET)||'{}')); }catch(e){}

function endpoint(){
  const u=new URL(location.href);
  return u.searchParams.get('url') || localStorage.getItem(K_URL) || '';
}
function fmt(v){ return (Math.round(v*10)/10).toFixed(1); }


/* ---------- オードメーター（数字が回って切り替わる） ----------
   桁の高さは実測ピクセルで決める。書体による em のずれで
   桁の途中に止まるのを防ぐ。 */
const REPEAT=3, MID=10;
function odoUnit(el){
  const cs=getComputedStyle(el);
  const fs=parseFloat(cs.fontSize)||16;
  let lh=parseFloat(cs.lineHeight);
  if(!isFinite(lh)) lh=fs;
  return Math.max(8, Math.round(Math.min(lh, fs*1.2)));
}
function odoBuild(el, text){
  el.classList.add('odo');
  el.innerHTML=''; el._slots=[];
  const H=odoUnit(el);
  el._h=H;
  for(const ch of text){
    if(ch>='0' && ch<='9'){
      const slot=document.createElement('span');
      slot.className='slot'; slot.style.height=H+'px';
      const strip=document.createElement('span'); strip.className='strip';
      for(let r=0;r<REPEAT;r++) for(let d=0;d<10;d++){
        const x=document.createElement('span');
        x.textContent=d; x.style.height=H+'px'; x.style.lineHeight=H+'px';
        strip.appendChild(x);
      }
      slot.appendChild(strip); el.appendChild(slot);
      const d=Number(ch);
      strip.style.transition='none';
      strip.style.transform='translateY('+(-(MID+d)*H)+'px)';
      el._slots.push({strip, d, kind:'d', tid:0});
    } else {
      const f=document.createElement('span'); f.className='fixed'; f.textContent=ch;
      el.appendChild(f); el._slots.push({el:f, kind:'f', ch});
    }
  }
  el._text=text;
}
function odoSet(el, text, dir, ms){
  if(!el) return;
  if(!el._slots || el._text===undefined || el._text.length!==text.length
     || !el.classList.contains('odo') || el._h!==odoUnit(el)
     || el._slots.some((s,i)=>s.kind==='f' && s.ch!==text[i])){
    odoBuild(el, text); return;
  }
  const dur=(ms===undefined?600:ms), H=el._h;
  el._slots.forEach((s,i)=>{
    if(s.kind!=='d') return;
    const want=Number(text[i]), cur=s.d;
    if(cur===want) return;
    let delta;
    if(dir>0)      delta =  (want-cur+10)%10;
    else if(dir<0) delta = -((cur-want+10)%10);
    else { const up=(want-cur+10)%10, dn=(cur-want+10)%10; delta = up<=dn ? up : -dn; }

    clearTimeout(s.tid);
    // いまの数字の位置へ確実に吸着させてから動かす
    s.strip.style.transition='none';
    s.strip.style.transform='translateY('+(-(MID+cur)*H)+'px)';
    void s.strip.offsetHeight;
    s.strip.style.transition='transform '+dur+'ms cubic-bezier(.22,.9,.24,1)';
    s.strip.style.transform='translateY('+(-(MID+cur+delta)*H)+'px)';
    s.d=want;
    // 動き終わったら正しい位置に置き直す
    s.tid=setTimeout(()=>{
      s.strip.style.transition='none';
      s.strip.style.transform='translateY('+(-(MID+s.d)*el._h)+'px)';
    }, dur+60);
  });
  el._text=text;
}
let lastTemp=null;
function setNum(el, text, value){
  if(!el) return;
  if(!cfg.odo){ el.textContent=text; el._slots=null; el._text=undefined; return; }
  const dir=(lastTemp===null||value===lastTemp)?0:(value>lastTemp?1:-1);
  odoSet(el, text, dir, 650);
}
function setVal(el, text, ms){
  if(!el) return;
  if(!cfg.odo){ el.textContent=text; el._slots=null; el._text=undefined; el._v=text; return; }
  const prev=el._v;
  let dir=0;
  if(prev!==undefined && prev!==null){
    const a=parseFloat(String(prev).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(text).replace(/[^0-9.\-]/g,''));
    if(isFinite(a)&&isFinite(b)&&a!==b) dir = b>a ? 1 : -1;
  }
  el._v=text;
  odoSet(el, text, dir, ms===undefined?450:ms);
}

/* ---------- アラート ---------- */
let lastState='', lastNotify=0;
function checkAlert(d){
  const el=$('alert');
  let state='', html='';
  const dead = cfg.deadMin>0 && d.ageSec > cfg.deadMin*60;
  if(dead){
    state='dead';
    html='<b>記録が止まっています</b>最後の記録から'+Math.round(d.ageSec/60)
       +'分経過しました。記録側の画面が閉じていないか確認してください。';
  } else if(cfg.hi!==null && d.temp>=cfg.hi){
    state='hot';
    html='<b>高温です</b>'+fmt(d.temp)+'°C（しきい値 '+fmt(cfg.hi)+'°C 以上）';
  } else if(cfg.lo!==null && d.temp<=cfg.lo){
    state='cold';
    html='<b>低温です</b>'+fmt(d.temp)+'°C（しきい値 '+fmt(cfg.lo)+'°C 以下）';
  }
  if(state){
    el.className='banner '+state; el.innerHTML=html; el.style.display='block';
    const now=Date.now();
    if(state!==lastState || now-lastNotify>300000){   // 状態が変わったとき、または5分ごと
      notify(el.textContent);
      lastNotify=now;
    }
  } else {
    el.style.display='none';
  }
  lastState=state;
  return state;
}
function notify(text){
  try{
    if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
    new Notification('気温アラート', {body:text, tag:'templogger'});
  }catch(e){}
}

/* ---------- 上部 ---------- */
function renderHead(d, state){
  const stale = d.ageSec > 600;
  let cls='big';
  if(state==='hot') cls+=' hot'; else if(state==='cold') cls+=' cold';
  else if(stale) cls+=' stale';

  const now=$('now');
  // 骨組みは一度だけ作り、以降は数値だけ差し替える
  if(!now._built){
    now.innerHTML =
      '<div class="'+cls+'" id="bigWrap"><span id="bigNum">--.-</span><span class="unit">°C</span></div>'
      + '<div class="trend" id="trendBox"></div>'
      + '<div class="sub" id="subBox"></div>'
      + '<div class="cards">'
      + '<div class="c"><span class="k">全期間 最高</span><b class="hi" id="cMax">-</b></div>'
      + '<div class="c"><span class="k">全期間 最低</span><b class="lo" id="cMin">-</b></div>'
      + '<div class="c"><span class="k">10秒値</span><b id="cCnt">-</b></div>'
      + '</div>';
    now._built=true;
  }
  $('bigWrap').className=cls;
  setNum($('bigNum'), fmt(d.temp), d.temp);

  const m=d.minutes||[];
  if(m.length>=11){
    const diff=m[0].avg-m[10].avg;
    const arrow = diff>0.05?'▲' : diff<-0.05?'▼' : '→';
    const tb=$('trendBox');
    if(!tb._built){
      tb.innerHTML='<span id="trArrow"></span><span> 10分で </span>'
                 + '<span id="trVal"></span><span>°C</span>';
      tb._built=true;
    }
    $('trArrow').textContent=arrow;
    setVal($('trVal'), (diff>=0?'+':'')+diff.toFixed(1));
  } else { $('trendBox').textContent=''; $('trendBox')._built=false; }
  $('subBox').textContent = d.at+'（'+d.ageSec+'秒前）';

  setVal($('cMax'), fmt(d.allMax));
  setVal($('cMin'), fmt(d.allMin));
  setVal($('cCnt'), (d.count||0).toLocaleString());
  lastTemp=d.temp;
}

/* ---------- グラフ ---------- */
/* ---------- 欠測を考慮した時系列 ---------- */
function buildSeries(minutes, spanMin){
  const md = l => { const a=(l||'0:0').split(':'); return Number(a[0])*60+Number(a[1]); };
  const asc = minutes.slice().reverse();
  if(!asc.length) return {pts:[], gaps:[], total:0};
  const pos=[0];
  for(let i=1;i<asc.length;i++){
    let dm=(md(asc[i].label)-md(asc[i-1].label)+1440)%1440;
    if(dm===0) dm=1;
    pos.push(pos[i-1]+dm);
  }
  const last=pos[pos.length-1];
  const from=last-spanMin+1;
  const keep=[];
  for(let i=0;i<asc.length;i++) if(pos[i]>=from) keep.push({m:asc[i], p:pos[i]});
  if(keep.length<2) return {pts:keep, gaps:[], total:1};
  const base=keep[0].p;
  const pts=keep.map(k=>Object.assign({}, k.m, {p:k.p-base}));
  const total=pts[pts.length-1].p || 1;
  const gaps=[];
  for(let i=1;i<pts.length;i++){
    const d=pts[i].p-pts[i-1].p;
    if(d>1) gaps.push({from:pts[i-1].p, to:pts[i].p, minutes:d-1});
  }
  return {pts, gaps, total};
}


function niceStep(range, target){
  const raw=range/target;
  const mag=Math.pow(10, Math.floor(Math.log10(raw)));
  const n=raw/mag;
  return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
}
let chartMap=null, chartPts=[], hoverIdx=null;
function drawChart(d){
  const ser=buildSeries(d.minutes||[], 60);
  const pts=ser.pts;
  chartPts=pts;
  const cv=$('chart'), ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(pts.length<2){ chartMap=null; return; }

  let mn=Math.min(...pts.map(p=>p.min)), mx=Math.max(...pts.map(p=>p.max));
  if(cfg.hi!==null && cfg.hi<=mx+3) mx=Math.max(mx,cfg.hi);
  if(cfg.lo!==null && cfg.lo>=mn-3) mn=Math.min(mn,cfg.lo);
  const span=(mx-mn)||0.4;
  const step=niceStep(span*1.25,4);
  const lo=Math.floor((mn-span*0.1)/step)*step;
  const hi=Math.ceil((mx+span*0.1)/step)*step;
  const dec=Math.max(0,-Math.floor(Math.log10(step)));
  const padL=34,padR=6,padT=8,padB=16;
  const X=p=>padL+(W-padL-padR)*(p/ser.total);
  const Y=v=>H-padB-(H-padB-padT)*((v-lo)/((hi-lo)||1));
  chartMap={X,Y,lo,hi,padL,padR,padT,padB,W,H,total:ser.total};

  ctx.font='700 10px "Roboto","BIZ UDPGothic",sans-serif'; ctx.textBaseline='middle';
  for(let v=lo; v<=hi+step*1e-6; v+=step){
    const y=Y(v);
    ctx.strokeStyle='#2b3733'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,Math.round(y)+.5); ctx.lineTo(W-padR,Math.round(y)+.5); ctx.stroke();
    ctx.fillStyle='#7e8d86'; ctx.fillText(v.toFixed(dec),2,y);
  }
  ctx.textBaseline='alphabetic';

  // 欠測の区間
  ser.gaps.forEach(g=>{
    const x0=X(g.from), x1=X(g.to);
    ctx.fillStyle='rgba(217,99,74,.15)';
    ctx.fillRect(x0,padT,x1-x0,H-padB-padT);
    ctx.strokeStyle='rgba(217,99,74,.55)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x0,padT); ctx.lineTo(x0,H-padB);
    ctx.moveTo(x1,padT); ctx.lineTo(x1,H-padB); ctx.stroke(); ctx.setLineDash([]);
    if(x1-x0>30){
      ctx.fillStyle='#d9634a'; ctx.font='700 9px "Roboto","BIZ UDPGothic",sans-serif';
      const t='欠測'+g.minutes+'分';
      ctx.fillText(t,(x0+x1)/2-ctx.measureText(t).width/2, padT+9);
    }
  });

  [[cfg.hi,'#e8b230'],[cfg.lo,'#6fb3d9']].forEach(function(z){
    var v=z[0], col=z[1];
    if(v===null||v<lo||v>hi) return;
    const y=Y(v);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.setLineDash([]);
  });

  // 連続区間ごとに描く
  const runs=[]; let cur=[pts[0]];
  for(let i=1;i<pts.length;i++){
    if(pts[i].p-pts[i-1].p>1){ runs.push(cur); cur=[]; }
    cur.push(pts[i]);
  }
  runs.push(cur);

  runs.forEach(run=>{
    if(run.length<2) return;
    ctx.fillStyle='rgba(51,199,110,.16)';
    ctx.beginPath();
    run.forEach((p,i)=>{ const x=X(p.p),y=Y(p.max); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    for(let i=run.length-1;i>=0;i--) ctx.lineTo(X(run[i].p),Y(run[i].min));
    ctx.closePath(); ctx.fill();
  });
  ctx.strokeStyle='#33c76e'; ctx.lineWidth=1.8;
  runs.forEach(run=>{
    ctx.beginPath();
    run.forEach((p,i)=>{ const x=X(p.p),y=Y(p.avg); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    if(run.length===1){ ctx.fillStyle='#33c76e';
      ctx.arc(X(run[0].p),Y(run[0].avg),2,0,Math.PI*2); ctx.fill(); }
    else ctx.stroke();
  });

  const last=pts[pts.length-1];
  ctx.fillStyle='#33c76e';
  ctx.beginPath(); ctx.arc(X(last.p),Y(last.avg),3.5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#7e8d86'; ctx.font='700 10px "Roboto","BIZ UDPGothic",sans-serif';
  ctx.fillText(pts[0].label,padL,H-4);
  ctx.fillText(last.label, W-padR-ctx.measureText(last.label).width, H-4);

  if(hoverIdx!==null && hoverIdx>=0 && hoverIdx<pts.length){
    const p=pts[hoverIdx], hx=X(p.p), hy=Y(p.avg);
    ctx.strokeStyle='rgba(232,178,48,.85)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx,padT); ctx.lineTo(hx,H-padB); ctx.stroke();
    ctx.fillStyle='#e8b230';
    ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2); ctx.fill();

    const l1=p.label+'  '+fmt(p.avg)+'\u00b0C';
    const l2='最高 '+fmt(p.max)+'  最低 '+fmt(p.min)+((p.cnt||0)<6?'  一部欠測':'');
    ctx.font='700 12px "Roboto","BIZ UDPGothic",sans-serif';
    const bw=Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width)+12;
    const bh=34;
    let bx=Math.max(padL, Math.min(W-padR-bw, hx-bw/2));
    let by=padT;
    if(hy<padT+bh+8) by=H-padB-bh;
    ctx.fillStyle='rgba(11,15,13,.94)';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='#2b3733'; ctx.lineWidth=1;
    ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    ctx.textBaseline='middle';
    ctx.fillStyle='#dfe6e1'; ctx.fillText(l1, bx+6, by+11);
    ctx.fillStyle='#7e8d86'; ctx.fillText(l2, bx+6, by+25);
    ctx.textBaseline='alphabetic';
    ctx.font='700 10px "Roboto","BIZ UDPGothic",sans-serif';
  }
}

/* ---------- グラフを触って値を見る ---------- */
function pickAt(clientX){
  if(!chartMap || chartPts.length<2) return;
  const cv=$('chart'), r=cv.getBoundingClientRect();
  const x=clientX-r.left;
  const {padL,padR,W,total}=chartMap;
  const frac=(x-padL)/Math.max(1,(W-padL-padR));
  const target=Math.min(1,Math.max(0,frac))*total;
  let best=0, bd=Infinity;
  chartPts.forEach((p,i)=>{ const d=Math.abs(p.p-target); if(d<bd){bd=d;best=i;} });
  hoverIdx=best;
  redrawHover();
}
let lastData=null;
function redrawHover(){ if(lastData) drawChart(lastData); }
function clearHover(){ if(hoverIdx!==null){ hoverIdx=null; redrawHover(); } }

(function(){
  const cv=$('chart');
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    cv.setPointerCapture(e.pointerId);
    pickAt(e.clientX);
  });
  cv.addEventListener('pointermove', e=>{
    if(e.buttons || e.pressure>0){ e.stopPropagation(); pickAt(e.clientX); }
  });
  // グラフ以外を触ったら消す
  document.addEventListener('pointerdown', e=>{
    if(e.target !== cv) clearHover();
  });
})();

/* ---------- 表 ---------- */
let tableKey='';
function renderTable(d){
  const key=(d.minutes||[]).map(m=>m.label+':'+m.max+':'+m.min+':'+m.avg).join('|');
  if(key===tableKey) return;
  tableKey=key;
  const list=d.minutes||[];
  const mdv=l=>{const a=(l||'0:0').split(':'); return Number(a[0])*60+Number(a[1]);};
  const rows=list.map((m,i)=>{
    const nxt=list[i+1];
    let gapRow='';
    if(nxt){
      const dd=(mdv(m.label)-mdv(nxt.label)+1440)%1440;
      if(dd>1) gapRow='<tr class="gap"><td colspan="4">欠測 '+(dd-1)+'分</td></tr>';
    }
    const ten = m.tenMin || (Number((m.label||'').split(':')[1])%10===0);
    return '<tr'+(ten?' class="ten"':'')+'>'
      + '<th>'+m.label+'</th>'
      + '<td class="hi">'+fmt(m.max)+'</td>'
      + '<td class="lo">'+fmt(m.min)+'</td>'
      + '<td>'+fmt(m.avg)+'</td></tr>' + gapRow;
  }).join('');
  const date=(d.at||'').slice(5,10).replace('-','/');
  $('table').innerHTML='<table><thead><tr>'
    + '<th class="corner">'+date+'</th>'
    + '<th>最高<br>気温</th><th>最低<br>気温</th><th>気温</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- 取得 ---------- */
async function load(){
  if(document.hidden) return;          // 見ていない間は通信しない
  const url=endpoint();
  if(!url){ $('setup').style.display='block'; return; }
  $('setup').style.display='none';
  try{
    const sep=url.includes('?')?'&':'?';
    const res=await fetchTimeout(url+sep+'format=json&_='+Date.now(), {}, 15000);
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||'応答が不正です');
    if(d.empty){
      $('app').innerHTML='<div class="msg">まだ記録がありません</div>';
      $('now').innerHTML=''; $('now')._built=false;
      $('table').innerHTML=''; tableKey='';
      return;
    }
    $('app').innerHTML='';
    lastData=d;
    const state=checkAlert(d);
    renderHead(d,state);
    // 表示中の分が増えたら選択位置をずらして、同じ時刻を指し続ける
    if(hoverIdx!==null && chartPts.length){
      const prev=chartPts[hoverIdx] ? chartPts[hoverIdx].label : null;
      const next=(d.minutes||[]).slice().reverse();
      const found=prev ? next.findIndex(m=>m.label===prev) : -1;
      hoverIdx = found>=0 ? found : null;
    }
    drawChart(d);
    renderTable(d);
  }catch(e){
    $('app').innerHTML='<div class="msg">読み込めませんでした<div class="err">'+String(e)
      +'</div>URLと、デプロイのアクセス権が「全員」かを確認してください。</div>';
    $('now')._built=false; $('now').innerHTML=''; $('table').innerHTML=''; tableKey='';
  }
}

/* ---------- 操作 ---------- */
$('save').onclick=()=>{
  const v=$('url').value.trim();
  if(!v) return;
  localStorage.setItem(K_URL,v); load();
};
$('change').onclick=e=>{ e.preventDefault(); $('url').value=endpoint(); $('setup').style.display='block'; };
$('openSet').onclick=e=>{
  e.preventDefault();
  $('hi').value = cfg.hi===null?'':cfg.hi;
  $('lo').value = cfg.lo===null?'':cfg.lo;
  $('deadMin').value = cfg.deadMin;
  $('pollSec').value = cfg.pollSec;
  $('odoOn').checked = !!cfg.odo;
  $('settings').style.display = $('settings').style.display==='block' ? 'none' : 'block';
};
$('saveSet').onclick=()=>{
  const num=v=>{ const t=parseFloat(v); return isFinite(t)?t:null; };
  cfg.hi=num($('hi').value); cfg.lo=num($('lo').value);
  const dm=parseFloat($('deadMin').value); cfg.deadMin=isFinite(dm)?dm:0;
  const ps=parseFloat($('pollSec').value); cfg.pollSec=isFinite(ps)&&ps>=2?ps:5;
  cfg.odo=$('odoOn').checked;
  ['bigNum','cMax','cMin','cCnt'].forEach(id=>{
    const e=$(id); if(e){ e._slots=null; e._text=undefined; e._v=undefined; }
  });
  restartPoll();
  localStorage.setItem(K_SET, JSON.stringify(cfg));
  $('settings').style.display='none';
  lastState=''; load();
};
$('notify').onclick=async ()=>{
  if(typeof Notification==='undefined'){ $('notify').textContent='この環境では通知は使えません'; return; }
  try{
    const p=await Notification.requestPermission();
    $('notify').textContent = p==='granted' ? '通知は許可されています' : '通知は許可されませんでした';
  }catch(e){ $('notify').textContent='通知を有効にできませんでした（ホーム画面に追加してからお試しください）'; }
};


/* ---------- 遠隔で校正 ---------- */
// 画像は「取得」を押したときだけ、その瞬間のものを撮ってもらう
let snapAtSeen='', snapTakenAt=0;

async function fetchSnap(){
  const url=endpoint();
  const r=await fetchTimeout(url+(url.includes('?')?'&':'?')+'what=snapshot&_='+Date.now(), {}, 20000);
  return await r.json();
}

async function requestSnapshot(){
  const url=endpoint();
  if(!url){ $('cmdState').textContent='接続先が未設定です'; return; }
  $('refreshSnap').disabled=true;
  $('cmdState').textContent='記録側に撮影を要求しています…';
  // 今ある画像の時刻を控えて、新しいものが来たか判定する
  try{ const cur=await fetchSnap(); snapAtSeen = (cur && cur.at) || ''; }catch(e){}
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cmd:{id:String(Date.now()), type:'snapshot'}})});
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||'送信に失敗');
  }catch(e){
    $('cmdState').textContent='要求を送れません: '+e;
    $('refreshSnap').disabled=false; return;
  }
  waitForSnap(0);
}

async function waitForSnap(n){
  if(n>15){
    $('cmdState').textContent='画像が届きません。記録側の画面が開いていて、「遠隔操作」が有効か確認してください。';
    $('refreshSnap').disabled=false; return;
  }
  try{
    const d=await fetchSnap();
    if(d && d.ok && d.image && d.at && d.at!==snapAtSeen){
      $('snap').src=d.image;
      $('snap').style.display='block';
      $('calBox').style.display='block';
      snapTakenAt=Date.now();
      $('snapAt').textContent='撮影 '+d.at+'　この画像の数字を読んで入力してください';
      $('cmdState').textContent='';
      $('refreshSnap').disabled=false;
      return;
    }
  }catch(e){}
  setTimeout(()=>waitForSnap(n+1), 1500);
}

async function sendCmd(cmd){
  const url=endpoint();
  if(!url) return;
  $('cmdState').textContent='送信中…';
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({cmd:Object.assign({id:String(Date.now())}, cmd)})});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'送信に失敗');
    $('cmdState').textContent='指示を送りました。結果を待っています…';
    pollResult(0);
  }catch(e){ $('cmdState').textContent='送信できません: '+e; }
}

async function pollResult(n){
  if(n>15){ $('cmdState').textContent='応答がありません。記録側が動いているか確認してください。'; return; }
  const url=endpoint();
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'what=cmd&_='+Date.now());
    const d=await r.json();
    if(d && d.ok && d.result){
      $('cmdState').textContent=(d.result.ok?'\u2713 ':'\u00d7 ')+d.result.msg;
      // 校正後の画像に差し替える
      try{
        const sn=await fetchSnap();
        if(sn && sn.image){ $('snap').src=sn.image; $('snapAt').textContent='校正後 '+(sn.at||''); }
      }catch(e){}
      return;
    }
  }catch(e){}
  setTimeout(()=>pollResult(n+1), 1500);
}

$('openRemote').onclick=e=>{
  e.preventDefault();
  const el=$('remote');
  el.style.display = el.style.display==='block' ? 'none' : 'block';
};
$('refreshSnap').onclick=requestSnapshot;
$('sendCal').onclick=()=>{
  const v=$('calVal').value.trim();
  if(!v){ $('cmdState').textContent='画像に写っている数字を入力してください'; return; }
  const age=(Date.now()-snapTakenAt)/1000;
  if(snapTakenAt && age>90 &&
     !confirm('画像を取得してから'+Math.round(age)+'秒経っています。\n表示が変わっている可能性があります。取得し直さずに続けますか？')) return;
  sendCmd({type:'calibrate', value:v});
};

let pollTimer=null;
function restartPoll(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(load, Math.max(2, cfg.pollSec||5)*1000);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{
  ['bigNum','cMax','cMin','cCnt','trVal'].forEach(id=>{
    const e=$(id); if(e){ e._slots=null; e._text=undefined; }
  });
  if(lastData) renderHead(lastData, checkAlert(lastData));
});
load();
restartPoll();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
let rzTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(()=>{
    tableKey='';
    ['bigNum','cMax','cMin','cCnt','trVal'].forEach(id=>{
      const e=$(id); if(e){ e._slots=null; e._text=undefined; }
    });
    if(lastData){ renderHead(lastData, checkAlert(lastData)); drawChart(lastData); renderTable(lastData); }
  }, 200);
});
</script>

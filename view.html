<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いまの気温</title>
<style>
  :root{
    --ink:#0d1210; --panel:#161d1a; --line:#2b3733;
    --text:#dfe6e1; --muted:#7e8d86;
    --green:#33c76e; --amber:#e8b230; --blue:#6fb3d9; --red:#d9634a;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:18px 12px 48px;max-width:540px;margin:0 auto}

  .now{text-align:center;margin-bottom:20px}
  .big{font-size:76px;font-weight:700;font-family:var(--mono);line-height:1;color:var(--green)}
  .big.stale{color:var(--muted)}
  .unit{font-size:26px;margin-left:6px;color:var(--muted)}
  .sub{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono)}
  .warn{margin-top:10px;font-size:12px;color:var(--amber)}
  .err{margin-top:10px;font-size:12px;color:var(--red);word-break:break-all}

  .cards{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .c{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 14px;min-width:100px}
  .c .k{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:4px}
  .c b{font-family:var(--mono);font-size:20px;font-weight:700}

  table{width:100%;border-collapse:collapse;font-family:var(--mono)}
  thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);
    font-size:11px;font-weight:600;padding:9px 4px;line-height:1.3;
    border-bottom:1px solid var(--line)}
  thead th.corner{color:var(--text);font-size:13px}
  tbody th{font-weight:400;color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
  tbody td{text-align:center;font-size:15px;padding:8px 4px}
  tbody tr:nth-child(odd){background:rgba(255,255,255,.025)}
  tbody tr.ten{background:rgba(51,199,110,.16)}
  tbody tr.ten th{color:var(--green)}
  tbody tr.ten td{font-weight:700}
  tbody tr:first-child{box-shadow:inset 3px 0 0 var(--green)}
  .hi{color:var(--amber)} .lo{color:var(--blue)}
  .msg{color:var(--muted);font-size:14px;text-align:center;padding:50px 0;line-height:1.8}

  .setup{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:16px}
  .setup input{width:100%;background:#0b0f0d;color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:10px;font-family:var(--mono);font-size:11px}
  .setup button{margin-top:8px;width:100%;background:var(--green);color:#fff;border:none;
    border-radius:7px;padding:11px;font-size:14px;font-weight:600}
  .foot{text-align:center;margin-top:18px;font-size:11px;color:var(--muted)}
  .foot a{color:var(--muted)}
</style>
</head>
<body>

<div id="setup" class="setup" style="display:none">
  <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
    Apps Script の /exec URL を入れてください。次回からは自動で開きます。
  </div>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url">
  <button id="save">表示する</button>
</div>

<div id="now" class="now"></div>
<div id="table"></div>
<div id="app"></div>
<div class="foot"><a href="#" id="change">接続先を変更</a></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'templogger:viewUrl';

function endpoint(){
  const u = new URL(location.href);
  return u.searchParams.get('url') || localStorage.getItem(KEY) || '';
}

function fmt(v){ return (Math.round(v*10)/10).toFixed(1); }

function renderHead(d, ageSec){
  const stale = ageSec > 600;
  let h = '<div class="big' + (stale?' stale':'') + '">' + fmt(d.temp)
    + '<span class="unit">\u00b0C</span></div>'
    + '<div class="sub">' + d.at + '</div>';
  if(stale) h += '<div class="warn">' + Math.round(ageSec/60) + '分前の値です</div>';
  h += '<div class="cards">'
    + '<div class="c"><span class="k">全期間 最高</span><b class="hi">' + fmt(d.allMax) + '</b></div>'
    + '<div class="c"><span class="k">全期間 最低</span><b class="lo">' + fmt(d.allMin) + '</b></div>'
    + '<div class="c"><span class="k">記録数</span><b>' + d.count.toLocaleString() + '</b></div>'
    + '</div>';
  $('now').innerHTML = h;
}

// 表は中身が変わったときだけ描き直す（5秒ごとのちらつきを防ぐ）
let tableKey = '';
function renderTable(d){
  const key = (d.minutes||[]).map(m=>m.label+':'+m.max+':'+m.min+':'+m.avg).join('|');
  if(key === tableKey) return;
  tableKey = key;
  const rows = (d.minutes||[]).map(m => {
    const ten = m.tenMin || (Number((m.label||'').split(':')[1]) % 10 === 0);
    return '<tr' + (ten ? ' class="ten"' : '') + '>'
      + '<th>' + m.label + '</th>'
      + '<td class="hi">' + fmt(m.max) + '</td>'
      + '<td class="lo">' + fmt(m.min) + '</td>'
      + '<td>' + fmt(m.avg) + '</td></tr>';
  }).join('');
  const date = (d.at||'').slice(5,10).replace('-','/');
  $('table').innerHTML = '<table><thead><tr>'
    + '<th class="corner">' + date + '</th>'
    + '<th>最高<br>気温</th><th>最低<br>気温</th><th>気温</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

async function load(){
  const url = endpoint();
  if(!url){ $('setup').style.display='block'; return; }
  $('setup').style.display='none';
  try{
    const sep = url.includes('?') ? '&' : '?';
    const res = await fetch(url + sep + 'format=json&_=' + Date.now());
    const d = await res.json();
    if(!d.ok) throw new Error(d.error || '応答が不正です');
    if(d.empty){
      $('app').innerHTML = '<div class="msg">まだ記録がありません</div>';
      $('now').innerHTML=''; $('table').innerHTML=''; tableKey='';
      return;
    }
    $('app').innerHTML='';
    renderHead(d, d.ageSec);
    renderTable(d);
  }catch(e){
    $('app').innerHTML = '<div class="msg">読み込めませんでした<div class="err">'
      + String(e) + '</div>URLと、デプロイのアクセス権が「全員」かを確認してください。</div>';
  }
}

$('save').onclick = ()=>{
  const v = $('url').value.trim();
  if(!v) return;
  localStorage.setItem(KEY, v);
  load();
};
$('change').onclick = (e)=>{
  e.preventDefault();
  $('url').value = endpoint();
  $('setup').style.display='block';
};

load();
setInterval(load, 5000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>

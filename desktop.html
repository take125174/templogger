<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<title>気温モニター</title>
<style>
  :root{
    --ink:#07142b; --panel:#050e1d; --panel2:#040b17; --line:#22406f;
    --text:#f2f6fb;
    /* ラベルなども現在値と同じ色にする */
    --muted:#f2f6fb; --dim:#f2f6fb;
    --green:#4bc26a; --amber:#ffb400; --blue:#4fa8e8; --red:#e8503a;
    /* 本文はプロポーショナル、数値は等幅のUDフォント */
    --ja:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    --num:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",monospace;
    --mono:var(--num);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);transition:background 1.2s ease,color 1.2s ease;
    text-shadow:0 1px 2px rgba(0,0,0,.45);
    font-family:var(--ja);font-feature-settings:"palt" 1;
    font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;overflow:hidden}

  /* 上部バー */
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:var(--panel);flex:none;
    transition:background 1.2s ease,border-color 1.2s ease}
  header h1{font-size:15px;font-weight:700;letter-spacing:.18em;margin:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--green);box-shadow:0 0 10px rgba(75,194,106,.9)}
  .dot.warn{background:var(--amber)} .dot.dead{background:var(--red)}
  .spacer{flex:1}
  header .meta{font-family:var(--mono);font-size:11px;color:var(--muted);opacity:.75}
  header button{text-shadow:none;background:#20302a;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  header button:hover{background:#2a3f37}


  /* オードメーター表示 */
  .odo{display:inline-flex;align-items:baseline;line-height:1}
  .odo .slot{display:inline-block;overflow:hidden;position:relative;
    vertical-align:baseline;min-width:.62em}
  .odo .strip{display:flex;flex-direction:column;will-change:transform}
  .odo .strip>span{display:block;text-align:center}
  .odo .fixed{display:inline-block;text-align:center}
  input,select,button,option{text-shadow:none}
  main{flex:1;display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;overflow:hidden}
  @media (max-width:900px){ main{grid-template-columns:1fr;overflow:auto} }

  .col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
    transition:background 1.2s ease,border-color 1.2s ease}
  .card h2{font-size:12px;letter-spacing:.14em;color:var(--muted);opacity:.75;margin:0 0 10px;font-weight:700}

  /* 現在値 */
  .big{font-family:var(--num);font-size:clamp(48px,4.4vw,68px);font-weight:700;line-height:1;
    color:var(--text);text-align:center;letter-spacing:-.03em;text-shadow:0 3px 14px rgba(0,0,0,.55)}
  .big.hot{color:var(--amber)} .big.cold{color:var(--blue)} .big.stale{color:var(--dim)}
  .big.normal{color:#ffffff}
  .big small{font-size:26px;color:var(--muted);margin-left:6px;font-weight:700}
  .trend{text-align:center;font-family:var(--num);font-size:13px;font-weight:700;
    color:var(--muted);margin-top:7px;display:flex;align-items:baseline;justify-content:center}
  .trend.up{color:var(--amber)} .trend.down{color:var(--blue)} .trend.flat{color:var(--muted)}
  .at{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);opacity:.6;margin-top:6px}

  .kv{display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 0;border-bottom:1px solid rgba(43,55,51,.6);font-size:12px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--muted);font-weight:500}
  .kv b{font-family:var(--num);font-size:18px;font-weight:700}

  /* グラフ */
  .chartwrap{flex:none;display:flex;flex-direction:column}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--amber);border-color:var(--amber);color:#07142b;font-weight:700}
  .tabs .ma{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
    margin-left:8px;white-space:nowrap}
  .tabs .ma select{background:#0b1c38;color:var(--text);border:1px solid var(--line);
    border-radius:5px;padding:3px 5px;font-size:11px;font-family:inherit}
  .tabs{flex-wrap:wrap}
  .unitTag{font-size:11px;color:var(--dim);margin-left:auto;font-family:var(--num)}
  #chart{width:100%;height:min(300px,34vh);display:block;cursor:crosshair}

  /* 表 */
  .tablewrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .scroll{overflow:auto;flex:1;min-height:0}
  table{width:100%;border-collapse:collapse;font-family:var(--num);font-size:15px;font-weight:700}
  thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);opacity:.8;
    transition:background 1.2s ease;
    font-size:12px;font-weight:700;letter-spacing:.06em;padding:9px 10px;text-align:right;
    border-bottom:1px solid var(--line);white-space:nowrap}
  thead th:first-child{text-align:left}
  tbody td{padding:6px 10px;text-align:right;border-bottom:1px solid rgba(43,55,51,.35)}
  tbody td:first-child{text-align:left;color:var(--muted);opacity:.78;font-weight:500}
  tbody tr:hover{background:rgba(255,255,255,.04)}
  tbody tr.ten td:first-child{color:var(--amber);font-weight:700}
  tbody tr.ten{background:rgba(255,180,0,.10)}
  tbody tr.sel{outline:1px solid var(--amber);outline-offset:-1px}
  .hi{color:var(--amber)} .lo{color:var(--blue)}
  .up{color:var(--amber)} .down{color:var(--blue)} .flat{color:var(--dim)}
  .bad{color:var(--red)}
  tbody tr.gap td{text-align:center;color:var(--red);font-size:12px;font-weight:700;
    background:rgba(232,80,58,.10);padding:5px 10px}

  .banner{border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6;display:none}
  .banner b{display:block;font-size:14px;margin-bottom:2px}
  .banner.hot{background:#3a2a12;border:1px solid #7a5a20;color:#f5d489}
  .banner.cold{background:#12283a;border:1px solid #2a5a7a;color:#a9d4ef}
  .banner.dead{background:#3a1f1a;border:1px solid #7a3a32;color:#f3c4bb}

  .field{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .field label{flex:1}
  .field input{width:82px;background:#0b0f0d;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px;font-family:var(--mono);font-size:13px;text-align:center}
  .field input.wide{width:100%;text-align:left;font-size:11px}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow button{flex:1;background:#20302a;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:8px;font-size:12px;cursor:pointer;font-family:inherit}
  .btnrow button.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .msg{color:var(--muted);font-size:13px;text-align:center;padding:40px 0;line-height:1.9}

  /* 左カラムはスクロールせず収める */
  .col.left{overflow:hidden}
  .col.left .card{padding:11px 13px}
  .nowCard{padding:10px 13px 12px !important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
  .grid2 .g span{display:block;font-size:10px;color:var(--muted);opacity:.72;
    letter-spacing:.04em;margin-bottom:2px}
  .grid2 .g b{font-family:var(--num);font-size:16px;font-weight:700;line-height:1;
    display:inline-flex;align-items:baseline}

  /* 設定は重ねて出す */
  #setOverlay{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  #setOverlay.on{display:flex}
  #setOverlay .card{width:min(460px,100%);max-height:calc(100vh - 80px);overflow:auto}
  .ladderCard{flex:1;display:flex;flex-direction:column;min-height:120px}
  .ladderNow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .ladderNow b{font-size:19px;font-weight:700}
  .ladderNow .nextWrap{font-size:11px;color:var(--muted);opacity:.75;font-family:var(--num);
    display:inline-flex;align-items:baseline}
  #ladder{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
  .rung{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;gap:8px;
    padding:4px 8px;border-radius:5px;font-size:11px;color:var(--dim);opacity:.6;
    border:1px solid transparent;transition:background .6s ease,color .6s ease}
  .rung i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.18)}
  .rung span{flex:1}
  .rung b{font-family:var(--num);font-size:12px;font-weight:700}
  .rung.on{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--text);opacity:1}
  .rung i,.rung span,.rung b{position:relative;z-index:1}
  .rung .fill{position:absolute;left:0;top:0;bottom:0;z-index:0;
    background:rgba(255,255,255,.10);transition:width .8s ease}
  .rung.on b{color:var(--amber)}
  .err{color:var(--red);font-size:11px;word-break:break-all}
  .hint{font-size:10px;color:var(--dim);margin-top:10px;line-height:1.7}
  /* キオスク表示 */
  #kiosk{display:none;position:fixed;inset:0;z-index:50;background:var(--kbg,#07142b);
    flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:background 1.2s ease;cursor:pointer;user-select:none;padding:24px}
  #kiosk.on{display:flex}
  .kTop{position:absolute;top:26px;left:0;right:0;display:flex;
    align-items:center;justify-content:space-between;padding:0 40px}
  .kDate{font-family:var(--num);font-size:clamp(20px,2.4vw,34px);color:rgba(255,255,255,.75);
    letter-spacing:.04em;display:inline-flex;align-items:baseline}
  .kBadge{font-size:clamp(18px,2.2vw,30px);font-weight:700;padding:6px 20px;border-radius:999px;
    background:rgba(0,0,0,.28);color:#fff;letter-spacing:.1em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .kMain{display:flex;align-items:center;gap:20px}
  .kBig{font-family:var(--num);font-size:clamp(120px,25vw,320px);font-weight:700;line-height:.95;
    color:#fff;letter-spacing:-.04em;text-shadow:0 6px 40px rgba(0,0,0,.45)}
  .kBig .u{font-size:.3em;margin-left:.06em;opacity:.7}
  .kArrow{font-size:clamp(40px,7vw,90px);line-height:1;opacity:.85}
  .kSub{font-family:var(--num);font-size:clamp(14px,1.6vw,22px);color:rgba(255,255,255,.65)}
  #kSpark{width:min(78vw,900px);height:110px;margin-top:14px;opacity:.95}
  .kCards{display:flex;gap:clamp(18px,3.4vw,54px);margin-top:18px;flex-wrap:wrap;justify-content:center}
  .kCards div{text-align:center}
  .kCards span{display:block;font-size:clamp(11px,1.05vw,14px);color:rgba(255,255,255,.5);margin-bottom:5px}
  .kCards b{font-family:var(--num);font-size:clamp(22px,2.8vw,38px);font-weight:700;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5);display:inline-flex;align-items:baseline;justify-content:center}
  .kHint{position:absolute;bottom:20px;font-size:12px;color:rgba(255,255,255,.3)}
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:.35}}
  .kBadge.alert{animation:pulse 2.4s ease-in-out infinite}
  kbd{background:#20302a;border:1px solid var(--line);border-radius:3px;padding:1px 5px;
    font-family:var(--mono);font-size:10px}
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <h1>気温モニター</h1>
  <div class="meta" id="hdrMeta">—</div>
  <div class="spacer"></div>
  <div class="meta" id="countdown"></div>
  <button id="btnRefresh">更新</button>
  <button id="btnCsv">CSV</button>
  <button id="btnKiosk">大画面</button>
  <button id="btnFull">全画面</button>
  <button id="btnSettings">設定</button>
</header>

<main>
  <div class="col left">
    <div class="banner" id="alert"></div>

    <div class="card nowCard">
      <div class="big"><span id="bigNum">--.-</span><small>°C</small></div>
      <div class="trend" id="trend"></div>
      <div class="at" id="at"></div>
    </div>

    <div class="card">
      <div class="grid2">
        <div class="g"><span>全期間 最高</span><b class="hi" id="allMax">-</b></div>
        <div class="g"><span>全期間 最低</span><b class="lo" id="allMin">-</b></div>
        <div class="g"><span>1時間 最高</span><b class="hi" id="h1max">-</b></div>
        <div class="g"><span>1時間 最低</span><b class="lo" id="h1min">-</b></div>
        <div class="g"><span>1時間 平均</span><b id="h1avg">-</b></div>
        <div class="g"><span>1時間 変動幅</span><b id="h1range">-</b></div>
        <div class="g"><span>10秒値 / 生</span><b id="cnt">-</b></div>
        <div class="g"><span>欠測のある分</span><b id="h1gap">-</b></div>
      </div>
    </div>

    <div class="card ladderCard">
      <div class="ladderNow"><b id="ladderNow">—</b><span class="nextWrap"><span id="ladderNextName"></span><span id="ladderNextV"></span><span id="ladderNextU"></span></span></div>
      <div id="ladder"></div>
    </div>
  </div>

  <div class="col">
    <div class="card chartwrap">
      <div class="tabs">
        <button data-min="30">30分</button>
        <button data-min="60" class="on">1時間</button>
        <button data-min="360">6時間</button>
        <button data-min="1440">24時間</button>
        <button data-min="10080">7日</button>
        <button data-min="43200">30日</button>
        <button id="btnCustom">期間指定</button>
        <div class="spacer"></div>
        <label class="ma"><input type="checkbox" id="maOn" checked> 移動平均
          <select id="maN">
            <option value="5">5点</option>
            <option value="10" selected>10点</option>
            <option value="30">30点</option>
          </select>
        </label>
        <label class="ma"><input type="checkbox" id="rateOn"> 変化率</label>
      </div>
      <div id="customBox" style="display:none;margin-bottom:10px">
        <div class="field">
          <label>開始</label><input type="datetime-local" id="cFrom" style="width:auto;flex:1">
          <label style="flex:none">終了</label><input type="datetime-local" id="cTo" style="width:auto;flex:1">
          <button id="cApply" style="width:auto;padding:6px 14px;margin:0">表示</button>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <div class="card tablewrap">
      <h2>1分ごと（確定値）</h2>
      <div class="scroll">
        <table>
          <thead><tr>
            <th>時刻</th><th>最高</th><th>最低</th><th>気温</th><th>前分比</th><th>10秒値</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="setOverlay">
  <div class="card" id="setCard">
    <h2>設定</h2>
    <div class="field"><label>接続先</label></div>
    <div class="field"><input class="wide" id="url" placeholder="…/exec"></div>
    <div class="field"><label>高温アラート</label><input id="thHi" placeholder="35.0"></div>
    <div class="field"><label>低温アラート</label><input id="thLo" placeholder="20.0"></div>
    <div class="field"><label>停止とみなす分</label><input id="deadMin" placeholder="5"></div>
    <div class="field"><label>更新間隔（秒）</label><input id="pollSec" placeholder="5"></div>
    <div class="field"><label>数字を回して表示する</label>
      <input type="checkbox" id="odoOn" style="width:auto"></div>
    <div class="field" style="margin-top:12px"><label>気温で配色を変える</label>
      <input type="checkbox" id="bgOn" style="width:auto"></div>
    <div id="bandRows"></div>
    <div class="btnrow"><button id="btnBandReset">色を初期値に戻す</button></div>
    <div class="btnrow">
      <button id="btnNotify">通知を許可</button>
      <button class="go" id="btnSave">保存して閉じる</button>
    </div>
    <div class="hint">
      <kbd>R</kbd> 更新　<kbd>F</kbd> 全画面　<kbd>K</kbd> 大画面　<kbd>1</kbd>〜<kbd>6</kbd> 表示期間
      <div style="margin-top:8px">表示中の書体: <span id="fontNow">—</span></div>
    </div>
  </div>
</div>

<div id="kiosk">
  <div class="kTop">
    <div class="kDate"><span id="kDateT"></span><span id="kClock"></span></div>
    <div class="kBadge" id="kBadge"></div>
  </div>
  <div class="kMain">
    <div class="kBig"><span id="kBigNum">--.-</span><span class="u">°C</span></div>
    <div class="kArrow" id="kArrow"></div>
  </div>
  <div class="kSub" id="kSub"></div>
  <canvas id="kSpark"></canvas>
  <div class="kCards">
    <div><span>全期間 最高</span><b id="kMax">-</b></div>
    <div><span>全期間 最低</span><b id="kMin">-</b></div>
    <div><span>10分の変化</span><b id="kTrend">-</b></div>
    <div><span>1時間の幅</span><b id="kRange">-</b></div>
    <div><span>次の区分まで</span><b id="kNext">-</b></div>
  </div>
  <div class="kHint">クリック・<kbd>K</kbd>・<kbd>Esc</kbd> で戻る</div>
</div>

<div id="empty" class="msg" style="display:none"></div>

<script>
const $ = id => document.getElementById(id);
const K_URL='templogger:viewUrl', K_SET='templogger:alerts';
const BANDS_DEFAULT=[
  {t:-99, name:'平常',   c:'#07142b'},
  {t:25,  name:'夏日',   c:'#2e3a12'},
  {t:30,  name:'真夏日', c:'#4a2f0b'},
  {t:35,  name:'猛暑日', c:'#5c1a10'},
  {t:40,  name:'酷暑日', c:'#3d0c2b'}
];
let cfg={hi:null, lo:null, deadMin:5, pollSec:5, bgOn:true, odo:true,
         bands: BANDS_DEFAULT.map(b=>({...b}))};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(K_SET)||'{}')); }catch(e){}

let data=null, spanMin=60, hover=null, pollTimer=null, nextAt=0;

function endpoint(){
  const u=new URL(location.href);
  return u.searchParams.get('url') || localStorage.getItem(K_URL) || '';
}
const f1 = v => (Math.round(v*10)/10).toFixed(1);

/* ---------- 取得 ---------- */
async function load(){
  const url=endpoint();
  if(!url){ $('setOverlay').classList.add('on'); $('hdrMeta').textContent='接続先が未設定'; return; }
  try{
    const sep=url.includes('?')?'&':'?';
    const res=await fetch(url+sep+'format=json&_='+Date.now());
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||'応答が不正');
    if(d.empty){ $('hdrMeta').textContent='まだ記録がありません'; setDot('warn'); return; }
    data=d; render();
  }catch(e){
    $('hdrMeta').innerHTML='<span class="err">読み込めません: '+String(e)+'</span>';
    setDot('dead');
  }
  nextAt=Date.now()+Math.max(2,cfg.pollSec)*1000;
}
function setDot(c){ $('dot').className='dot'+(c?' '+c:''); }

/* ---------- 描画 ---------- */
function render(){
  const d=data;
  const state=checkAlert(d);
  const stale=d.ageSec>600;
  setDot(state==='dead'?'dead' : state?'warn' : (stale?'warn':'live'));

  let cls='big';
  if(state==='hot') cls+=' hot'; else if(state==='cold') cls+=' cold';
  else if(stale) cls+=' stale'; else cls+=' normal';
  document.querySelector('.big').className=cls;
  setNum($('bigNum'), f1(d.temp), d.temp);
  $('at').textContent=d.at+'　'+d.ageSec+'秒前';
  $('hdrMeta').textContent='最終記録 '+d.at;

  const m=d.minutes||[];
  if(m.length>=11){
    const diff=m[0].avg-m[10].avg;
    const ar=diff>0.05?'▲':diff<-0.05?'▼':'→';
    const c=diff>0.05?'up':diff<-0.05?'down':'flat';
    const tr=$('trend');
    if(!tr._built){
      tr.innerHTML='<span id="trArrow"></span><span id="trText"> 10分で </span>'
                 + '<span id="trVal"></span><span id="trUnit">°C</span>';
      tr._built=true;
    }
    tr.className='trend '+c;
    $('trArrow').textContent=ar;
    setVal($('trVal'), (diff>=0?'+':'')+diff.toFixed(1));
  } else { $('trend').textContent=''; $('trend')._built=false; }

  setVal($('allMax'), f1(d.allMax));
  setVal($('allMin'), f1(d.allMin));
  setVal($('cnt'), (d.count||0).toLocaleString()+' / '+(d.rawCount||0).toLocaleString());

  // 直近1時間の統計
  if(m.length){
    const avgs=m.map(x=>x.avg);
    const mx=Math.max(...m.map(x=>x.max)), mn=Math.min(...m.map(x=>x.min));
    const mean=avgs.reduce((a,b)=>a+b,0)/avgs.length;
    const sd=Math.sqrt(avgs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/avgs.length);
    const gaps=m.filter(x=>(x.cnt||0)<6).length;
    setVal($('h1max'), f1(mx)); setVal($('h1min'), f1(mn));
    setVal($('h1avg'), mean.toFixed(2));
    setVal($('h1range'), (mx-mn).toFixed(1));
    setVal($('h1gap'), gaps+' / '+m.length);
    $('h1gap').classList.toggle('bad', gaps>0);
  }
  applyBg(d.temp);
  drawLadder(d.temp);
  renderKiosk();
  lastTemp=d.temp;
  drawChart();
  drawTable();
}

function checkAlert(d){
  const el=$('alert');
  let state='', html='';
  if(cfg.deadMin>0 && d.ageSec>cfg.deadMin*60){
    state='dead';
    html='<b>記録が止まっています</b>最後の記録から'+Math.round(d.ageSec/60)+'分経過';
  } else if(cfg.hi!==null && d.temp>=cfg.hi){
    state='hot'; html='<b>高温</b>'+f1(d.temp)+'°C（しきい値 '+f1(cfg.hi)+'°C 以上）';
  } else if(cfg.lo!==null && d.temp<=cfg.lo){
    state='cold'; html='<b>低温</b>'+f1(d.temp)+'°C（しきい値 '+f1(cfg.lo)+'°C 以下）';
  }
  if(state){ el.className='banner '+state; el.innerHTML=html; el.style.display='block'; }
  else el.style.display='none';
  return state;
}



/* ---------- 期間データの取得 ---------- */
let rangeData=null, rangeMin=60, customFrom=null, customTo=null;

async function loadRange(){
  const url=endpoint();
  if(!url) return;
  const sep=url.includes('?')?'&':'?';
  let q='what=range&_='+Date.now();
  if(customFrom && customTo) q+='&from='+encodeURIComponent(customFrom)+'&to='+encodeURIComponent(customTo);
  else q+='&minutes='+rangeMin;
  try{
    const r=await fetch(url+sep+q);
    const d=await r.json();
    if(d.ok){ rangeData=d; drawChart(); }
  }catch(e){}
}

// 移動平均
function movingAvg(pts, n){
  const out=[];
  for(let i=0;i<pts.length;i++){
    let s=0,c=0;
    for(let j=Math.max(0,i-n+1); j<=i; j++){ s+=pts[j].avg; c++; }
    out.push(s/c);
  }
  return out;
}
// 変化率（°C/時）
function rateOfChange(pts, unitMin){
  const out=[];
  for(let i=0;i<pts.length;i++){
    if(i===0){ out.push(0); continue; }
    const dv=pts[i].avg-pts[i-1].avg;
    out.push(dv/(unitMin/60));
  }
  return out;
}

/* ---------- 欠測を考慮した時系列の組み立て ---------- */
// minutes は新しい順。ラベル HH:mm から実際の経過分を求める
function buildSeries(minutes, spanMin){
  const md = l => { const a=(l||'0:0').split(':'); return Number(a[0])*60+Number(a[1]); };
  const asc = minutes.slice().reverse();          // 古い順
  if(!asc.length) return {pts:[], gaps:[], total:0};
  const pos=[0];
  for(let i=1;i<asc.length;i++){
    let dm=(md(asc[i].label)-md(asc[i-1].label)+1440)%1440;
    if(dm===0) dm=1;                              // 同じ分が続く異常への保険
    pos.push(pos[i-1]+dm);
  }
  const last=pos[pos.length-1];
  // 直近 spanMin 分ぶんだけ残す
  const from=last-spanMin+1;
  const keep=[];
  for(let i=0;i<asc.length;i++) if(pos[i]>=from) keep.push({m:asc[i], p:pos[i]});
  if(keep.length<2) return {pts:keep, gaps:[], total:1};
  const base=keep[0].p;
  const pts=keep.map(k=>({...k.m, p:k.p-base}));
  const total=pts[pts.length-1].p || 1;
  // 抜けている区間
  const gaps=[];
  for(let i=1;i<pts.length;i++){
    const d=pts[i].p-pts[i-1].p;
    if(d>1) gaps.push({from:pts[i-1].p, to:pts[i].p, minutes:d-1});
  }
  return {pts, gaps, total};
}

/* ---------- グラフ ---------- */
function niceStep(range,target){
  const raw=range/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
}
let cmap=null;
function drawChart(){
  const cv=$('chart'), ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight||300;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  // 期間データがあればそれを使う（無ければ直近60分）
  let pts, gaps=[], total, unitMin=1;
  if(rangeData && rangeData.points && rangeData.points.length>1){
    unitMin=rangeData.unit||1;
    const raw=rangeData.points;
    const t0=raw[0].t;
    pts=raw.map(p=>({...p, p:(p.t-t0)/60000/unitMin}));
    total=pts[pts.length-1].p||1;
    for(let i=1;i<pts.length;i++){
      const d=pts[i].p-pts[i-1].p;
      if(d>1.5) gaps.push({from:pts[i-1].p, to:pts[i].p, minutes:Math.round((d-1)*unitMin)});
    }
  } else {
    const all=(data&&data.minutes)?data.minutes:[];
    const ser=buildSeries(all, 60);
    pts=ser.pts; gaps=ser.gaps; total=ser.total;
  }
  if(!pts || pts.length<2){ cmap=null; return; }

  const useMA=$('maOn').checked, maN=Number($('maN').value);
  const useRate=$('rateOn').checked;
  const ma=useMA?movingAvg(pts,maN):null;
  const rate=useRate?rateOfChange(pts,unitMin):null;

  let mn=Math.min(...pts.map(p=>p.min)), mx=Math.max(...pts.map(p=>p.max));
  if(cfg.hi!==null && cfg.hi<mx+4) mx=Math.max(mx,cfg.hi);
  if(cfg.lo!==null && cfg.lo>mn-4) mn=Math.min(mn,cfg.lo);
  const span=(mx-mn)||0.4;
  const step=niceStep(span*1.2,5);
  const lo=Math.floor((mn-span*0.08)/step)*step;
  const hi=Math.ceil((mx+span*0.08)/step)*step;
  const dec=Math.max(0,-Math.floor(Math.log10(step)));
  const padL=48,padR=useRate?52:14,padT=14,padB=26;
  const X=p=>padL+(W-padL-padR)*(p/total);
  const Y=v=>H-padB-(H-padB-padT)*((v-lo)/((hi-lo)||1));
  cmap={X,Y,pts,padL,padR,W,H,padT,padB,total,unitMin,ma,rate};

  ctx.font='400 11px "BIZ UDGothic", sans-serif';
  ctx.textBaseline='middle';
  for(let v=lo; v<=hi+step*1e-6; v+=step){
    const y=Y(v);
    ctx.strokeStyle=cssv('--line'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,Math.round(y)+.5); ctx.lineTo(W-padR,Math.round(y)+.5); ctx.stroke();
    ctx.fillStyle=cssv('--muted'); ctx.globalAlpha=.8;
    ctx.textAlign='right'; ctx.fillText(v.toFixed(dec),padL-8,y); ctx.globalAlpha=1;
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  gaps.forEach(g=>{
    const x0=X(g.from), x1=X(g.to);
    ctx.fillStyle='rgba(232,80,58,.13)';
    ctx.fillRect(x0,padT,x1-x0,H-padB-padT);
    ctx.strokeStyle='rgba(232,80,58,.5)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x0,padT); ctx.lineTo(x0,H-padB);
    ctx.moveTo(x1,padT); ctx.lineTo(x1,H-padB); ctx.stroke(); ctx.setLineDash([]);
    if(x1-x0>40){
      ctx.fillStyle='#e8503a'; ctx.font='700 10px "BIZ UDGothic", sans-serif';
      const t='欠測'+g.minutes+'分';
      ctx.fillText(t,(x0+x1)/2-ctx.measureText(t).width/2, padT+12);
    }
  });

  // 時刻の目盛り（点数に応じて間引く）
  const tick=Math.max(1, Math.round(pts.length/8));
  pts.forEach((p,i)=>{
    if(i%tick) return;
    const x=X(p.p);
    ctx.strokeStyle='rgba(255,180,0,.18)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillStyle=cssv('--dim'); ctx.globalAlpha=.7;
    ctx.font='700 11px "BIZ UDGothic", sans-serif';
    const w=ctx.measureText(p.label).width;
    ctx.fillText(p.label, Math.min(W-padR-w, Math.max(padL, x-w/2)), H-8);
    ctx.globalAlpha=1;
  });

  [[cfg.hi,'#ffb400'],[cfg.lo,'#4fa8e8']].forEach(function(z){
    if(z[0]===null||z[0]<lo||z[0]>hi) return;
    const y=Y(z[0]);
    ctx.strokeStyle=z[1]; ctx.lineWidth=1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.setLineDash([]);
  });

  const runs=[]; let cur=[{p:pts[0],i:0}];
  for(let i=1;i<pts.length;i++){
    if(pts[i].p-pts[i-1].p>1.5){ runs.push(cur); cur=[]; }
    cur.push({p:pts[i],i});
  }
  runs.push(cur);

  runs.forEach(run=>{
    if(run.length<2) return;
    ctx.fillStyle='rgba(79,168,232,.20)';
    ctx.beginPath();
    run.forEach((o,i)=>{const x=X(o.p.p),y=Y(o.p.max); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    for(let i=run.length-1;i>=0;i--) ctx.lineTo(X(run[i].p.p),Y(run[i].p.min));
    ctx.closePath(); ctx.fill();
  });
  ctx.strokeStyle=useMA?'rgba(255,180,0,.45)':'#ffb400';
  ctx.lineWidth=useMA?1.5:2.5; ctx.lineJoin='round';
  runs.forEach(run=>{
    ctx.beginPath();
    run.forEach((o,i)=>{const x=X(o.p.p),y=Y(o.p.avg); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    if(run.length>1) ctx.stroke();
  });

  // 移動平均
  if(ma){
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.5; ctx.lineJoin='round';
    runs.forEach(run=>{
      ctx.beginPath();
      run.forEach((o,i)=>{const x=X(o.p.p),y=Y(ma[o.i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      if(run.length>1) ctx.stroke();
    });
  }

  // 変化率（右軸）
  if(rate){
    const rmax=Math.max(0.5, Math.max(...rate.map(Math.abs)));
    const RY=v=>H-padB-(H-padB-padT)*((v+rmax)/(2*rmax));
    ctx.strokeStyle='rgba(75,194,106,.9)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    pts.forEach((p,i)=>{const x=X(p.p),y=RY(rate[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.stroke();
    ctx.strokeStyle='rgba(75,194,106,.3)'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(padL,RY(0)); ctx.lineTo(W-padR,RY(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#4bc26a'; ctx.font='400 10px "BIZ UDGothic", sans-serif';
    ctx.textAlign='left';
    ctx.fillText('+'+rmax.toFixed(1), W-padR+4, RY(rmax)+4);
    ctx.fillText('0', W-padR+4, RY(0)+4);
    ctx.fillText('-'+rmax.toFixed(1), W-padR+4, RY(-rmax)+4);
    ctx.fillText('°C/h', W-padR+4, padT+4);
  }

  const last=pts[pts.length-1];
  ctx.fillStyle='#ffb400';
  ctx.beginPath(); ctx.arc(X(last.p),Y(last.avg),5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=cssv('--ink');
  ctx.beginPath(); ctx.arc(X(last.p),Y(last.avg),2,0,Math.PI*2); ctx.fill();

  pts.forEach(p=>{
    if(unitMin>1 || (p.cnt||0)>=6) return;
    ctx.fillStyle='#e8503a';
    ctx.beginPath(); ctx.arc(X(p.p),Y(p.avg),2.5,0,Math.PI*2); ctx.fill();
  });

  if(hover!==null && hover>=0 && hover<pts.length){
    const p=pts[hover], hx=X(p.p), hy=Y(p.avg);
    ctx.strokeStyle='rgba(242,246,251,.8)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx,padT); ctx.lineTo(hx,H-padB); ctx.stroke();
    ctx.fillStyle='#f2f6fb';
    ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.fill();
    const lines=[p.label+'　'+f1(p.avg)+'°C',
                 '最高 '+f1(p.max)+'　最低 '+f1(p.min)];
    if(ma) lines.push('移動平均 '+f1(ma[hover])+'°C');
    if(rate) lines.push('変化率 '+(rate[hover]>=0?'+':'')+rate[hover].toFixed(2)+'°C/h');
    if(unitMin===1) lines.push('10秒値 '+(p.cnt||0)+' 個'+((p.cnt||0)<6?'（一部欠測）':''));
    ctx.font='700 13px "BIZ UDGothic", sans-serif';
    const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+16;
    const bh=lines.length*17+10;
    let bx=Math.min(W-padR-bw, Math.max(padL, hx-bw/2));
    let by=hy-bh-14; if(by<padT) by=hy+14;
    ctx.fillStyle=cssv('--ink'); ctx.globalAlpha=.96; ctx.fillRect(bx,by,bw,bh); ctx.globalAlpha=1;
    ctx.strokeStyle=cssv('--line'); ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
    ctx.textBaseline='middle';
    lines.forEach((l,i)=>{
      ctx.fillStyle = i===0 ? cssv('--amber') : cssv('--muted');
      ctx.fillText(l, bx+8, by+16+i*17);
    });
    ctx.textBaseline='alphabetic';
  }
}

/* ---------- 表 ---------- */
function drawTable(){
  const m=(data&&data.minutes)?data.minutes:[];
  const md=l=>{const a=(l||'0:0').split(':'); return Number(a[0])*60+Number(a[1]);};
  const rows=m.map((x,i)=>{
    const nxt=m[i+1];
    let gapRow='';
    if(nxt){
      const d=(md(x.label)-md(nxt.label)+1440)%1440;
      if(d>1) gapRow='<tr class="gap"><td colspan="6">欠測 '+(d-1)+'分（'
        +nxt.label+' 〜 '+x.label+' の間）</td></tr>';
    }
    const prev=m[i+1];
    let delta='—', dcls='flat';
    if(prev){
      const dv=x.avg-prev.avg;
      delta=(dv>=0?'+':'')+dv.toFixed(1);
      dcls = dv>0.05?'up' : dv<-0.05?'down' : 'flat';
      if(Math.abs(dv)<0.05) delta='±0.0';
    }
    const ten = x.tenMin || Number((x.label||'').split(':')[1])%10===0;
    const q=x.cnt||0;
    return '<tr class="'+(ten?'ten':'')+'" data-i="'+i+'">'
      + '<td>'+x.label+'</td>'
      + '<td class="hi">'+f1(x.max)+'</td>'
      + '<td class="lo">'+f1(x.min)+'</td>'
      + '<td>'+f1(x.avg)+'</td>'
      + '<td class="'+dcls+'">'+delta+'</td>'
      + '<td class="'+(q<6?'bad':'')+'">'+q+'</td></tr>' + gapRow;
  }).join('');
  $('tbody').innerHTML=rows;
}



/* ---------- オードメーター（数字が回って切り替わる） ----------
   桁の高さは実測ピクセルで決める。書体による em のずれで
   桁の途中に止まるのを防ぐ。 */
const REPEAT=3, MID=10;
function odoUnit(el){
  const cs=getComputedStyle(el);
  const fs=parseFloat(cs.fontSize)||16;
  let lh=parseFloat(cs.lineHeight);
  if(!isFinite(lh)) lh=fs;
  return Math.max(8, Math.round(Math.min(lh, fs*1.2)));
}
function odoBuild(el, text){
  el.classList.add('odo');
  el.innerHTML=''; el._slots=[];
  const H=odoUnit(el);
  el._h=H;
  for(const ch of text){
    if(ch>='0' && ch<='9'){
      const slot=document.createElement('span');
      slot.className='slot'; slot.style.height=H+'px';
      const strip=document.createElement('span'); strip.className='strip';
      for(let r=0;r<REPEAT;r++) for(let d=0;d<10;d++){
        const x=document.createElement('span');
        x.textContent=d; x.style.height=H+'px'; x.style.lineHeight=H+'px';
        strip.appendChild(x);
      }
      slot.appendChild(strip); el.appendChild(slot);
      const d=Number(ch);
      strip.style.transition='none';
      strip.style.transform='translateY('+(-(MID+d)*H)+'px)';
      el._slots.push({strip, d, kind:'d', tid:0});
    } else {
      const f=document.createElement('span'); f.className='fixed'; f.textContent=ch;
      el.appendChild(f); el._slots.push({el:f, kind:'f', ch});
    }
  }
  el._text=text;
}
function odoSet(el, text, dir, ms){
  if(!el) return;
  if(!el._slots || el._text===undefined || el._text.length!==text.length
     || !el.classList.contains('odo') || el._h!==odoUnit(el)
     || el._slots.some((s,i)=>s.kind==='f' && s.ch!==text[i])){
    odoBuild(el, text); return;
  }
  const dur=(ms===undefined?600:ms), H=el._h;
  el._slots.forEach((s,i)=>{
    if(s.kind!=='d') return;
    const want=Number(text[i]), cur=s.d;
    if(cur===want) return;
    let delta;
    if(dir>0)      delta =  (want-cur+10)%10;
    else if(dir<0) delta = -((cur-want+10)%10);
    else { const up=(want-cur+10)%10, dn=(cur-want+10)%10; delta = up<=dn ? up : -dn; }

    clearTimeout(s.tid);
    // いまの数字の位置へ確実に吸着させてから動かす
    s.strip.style.transition='none';
    s.strip.style.transform='translateY('+(-(MID+cur)*H)+'px)';
    void s.strip.offsetHeight;
    s.strip.style.transition='transform '+dur+'ms cubic-bezier(.22,.9,.24,1)';
    s.strip.style.transform='translateY('+(-(MID+cur+delta)*H)+'px)';
    s.d=want;
    // 動き終わったら正しい位置に置き直す
    s.tid=setTimeout(()=>{
      s.strip.style.transition='none';
      s.strip.style.transform='translateY('+(-(MID+s.d)*el._h)+'px)';
    }, dur+60);
  });
  el._text=text;
}
let lastTemp=null;
function setNum(el, text, value){
  if(!el) return;
  if(!cfg.odo){ el.textContent=text; el._slots=null; el._text=undefined; return; }
  const dir = (lastTemp===null||value===lastTemp) ? 0 : (value>lastTemp?1:-1);
  odoSet(el, text, dir, 650);
}
// 補助的な数値（統計など）。前回値と比べて向きを決める
function setVal(el, text, ms){
  if(!el) return;
  if(!cfg.odo){ el.textContent=text; el._slots=null; el._text=undefined; el._v=text; return; }
  const prev=el._v;
  let dir=0;
  if(prev!==undefined && prev!==null){
    const a=parseFloat(String(prev).replace(/[^0-9.\-]/g,''));
    const b=parseFloat(String(text).replace(/[^0-9.\-]/g,''));
    if(isFinite(a)&&isFinite(b)&&a!==b) dir = b>a ? 1 : -1;
  }
  el._v=text;
  odoSet(el, text, dir, ms===undefined?450:ms);
}
/* ---------- 気温で背景色を変える（しきい値方式） ---------- */
function bands(){ return (cfg.bands && cfg.bands.length) ? cfg.bands : BANDS_DEFAULT; }
function bandOf(temp){
  const bs=bands();
  let cur=bs[0];
  for(const b of bs) if(temp>=b.t) cur=b;
  return cur;
}
function nextBand(temp){
  const bs=bands();
  for(const b of bs) if(b.t>temp) return b;
  return null;
}
function hex2rgb(h){
  const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(h||'');
  return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[7,20,43];
}
const rgbs = a => 'rgb('+a.join(',')+')';
// 白へ寄せる（0〜1）
function lighten(rgb,t){ return rgb.map(v=>Math.round(v+(255-v)*t)); }
function darken(rgb,t){ return rgb.map(v=>Math.round(v*(1-t))); }
function lum(rgb){ return (rgb[0]*0.299+rgb[1]*0.587+rgb[2]*0.114)/255; }

let bgNow='';
// 区分の色から、画面全体の配色を作る
function applyBg(temp){
  const b = cfg.bgOn && isFinite(temp) ? bandOf(temp) : BANDS_DEFAULT[0];
  if(b.c===bgNow) return;                     // 区分が変わったときだけ切り替える
  bgNow=b.c;
  const base=hex2rgb(b.c);
  const r=document.documentElement.style;
  // 変えるのは面の色だけ。文字色は固定して読みやすさを保つ
  r.setProperty('--ink',   rgbs(base));
  r.setProperty('--panel', rgbs(darken(base, 0.34)));   // 背景より少し暗く
  r.setProperty('--panel2',rgbs(darken(base, 0.46)));
  r.setProperty('--line',  rgbs(lighten(base, 0.20)));
  r.setProperty('--kbg',   rgbs(base));
  document.body.style.background=rgbs(base);
  // 配色が変わったらグラフも描き直す
  setTimeout(()=>{ drawChart(); drawSpark(); }, 60);
}
// CSS変数を読む（グラフの色を配色に追従させる）
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

// しきい値の一覧を設定画面に描く
function drawBandRows(){
  const bs=bands();
  $('bandRows').innerHTML=bs.map((b,i)=>
    '<div class="field">'
    + '<label>'+b.name+(b.t>-90?'（'+b.t+'°C 以上）':'（'+bs[1].t+'°C 未満）')+'</label>'
    + '<input type="color" data-i="'+i+'" class="bandC" value="'+b.c+'" style="width:44px;padding:2px">'
    + '</div>').join('');
  document.querySelectorAll('.bandC').forEach(el=>{
    el.onchange=()=>{ cfg.bands[Number(el.dataset.i)].c=el.value; bgNow=''; applyBg(data?data.temp:NaN); };
  });
}

// 現在の区分と、次の区分までの余裕を表示する
function drawLadder(temp){
  const bs=bands(), cur=bandOf(temp), nx=nextBand(temp);
  $('ladder').innerHTML=bs.slice().reverse().map(b=>{
    const on = b===cur;
    let fill='';
    if(on){
      // その区分の中でどこまで来ているかを帯で示す
      const lowEdge = b.t>-90 ? b.t : (bs[1] ? bs[1].t-5 : temp-5);
      const highEdge = nx ? nx.t : lowEdge+5;
      const r=Math.max(0, Math.min(1, (temp-lowEdge)/((highEdge-lowEdge)||1)));
      fill='<div class="fill" style="width:'+(r*100).toFixed(1)+'%"></div>';
    }
    return '<div class="rung'+(on?' on':'')+'">'+fill
      + '<i style="background:'+b.c+'"></i>'
      + '<span>'+b.name+'</span>'
      + '<b>'+(b.t>-90? b.t+'°C':'—')+'</b></div>';
  }).join('');
  $('ladderNow').textContent = cur.name;
  $('ladderNow').style.color = cur.t>=35 ? 'var(--red)' : cur.t>=30 ? 'var(--amber)'
                              : cur.t>=25 ? '#c8d94f' : 'var(--muted)';
  if(nx){
    $('ladderNextName').textContent=nx.name+'まで あと ';
    setVal($('ladderNextV'), (nx.t-temp).toFixed(1));
    $('ladderNextU').textContent='°C';
  } else {
    $('ladderNextName').textContent='最上位の区分です';
    $('ladderNextV').textContent=''; $('ladderNextU').textContent='';
  }
}

/* ---------- キオスク表示 ---------- */
let kiosk=false;
function toggleKiosk(on){
  kiosk = (on===undefined) ? !kiosk : on;
  $('kiosk').classList.toggle('on', kiosk);
  if(kiosk) renderKiosk();
}
function renderKiosk(){
  if(!kiosk || !data) return;
  const d=data, now=new Date();
  const p=n=>String(n).padStart(2,'0');
  const wd=['日','月','火','水','木','金','土'][now.getDay()];
  $('kDateT').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日（'+wd+'）　';
  setVal($('kClock'), p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds()), 300);

  const band=bandOf(d.temp);
  const badge=$('kBadge');
  badge.textContent=band.name;
  badge.classList.toggle('alert', band.t>=35);
  badge.style.background = band.t>=25 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.10)';

  setNum($('kBigNum'), f1(d.temp), d.temp);
  $('kSub').textContent=d.at.slice(11)+'　'+d.ageSec+'秒前'
    + (d.ageSec>600 ? '　※更新が止まっています' : '');

  const m=d.minutes||[];
  let diff=null;
  if(m.length>=11) diff=m[0].avg-m[10].avg;
  $('kArrow').innerHTML = diff===null ? '' :
    diff>0.05 ? '<span style="color:#ff9d5c">▲</span>' :
    diff<-0.05 ? '<span style="color:#7fc7f5">▼</span>' :
    '<span style="color:rgba(255,255,255,.4)">—</span>';
  if(diff===null) $('kTrend').textContent='—';
  else setVal($('kTrend'), (diff>=0?'+':'')+diff.toFixed(1));
  setVal($('kMax'), f1(d.allMax));
  setVal($('kMin'), f1(d.allMin));
  if(m.length){
    const mx=Math.max(...m.map(x=>x.max)), mn=Math.min(...m.map(x=>x.min));
    setVal($('kRange'), (mx-mn).toFixed(1));
  } else $('kRange').textContent='—';
  const nx=nextBand(d.temp);
  if(nx) setVal($('kNext'), (nx.t-d.temp).toFixed(1)+'°C');
  else $('kNext').textContent='—';

  drawSpark();
}

// 大画面用の推移グラフ
function drawSpark(){
  const cv=$('kSpark'); if(!cv) return;
  const m=(data&&data.minutes)?data.minutes.slice().reverse():[];
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight||110;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(m.length<2) return;
  const mn=Math.min(...m.map(x=>x.min)), mx=Math.max(...m.map(x=>x.max));
  const pad=(mx-mn)*0.18||0.3;
  const lo=mn-pad, hi=mx+pad;
  const X=i=>(W)*(i/(m.length-1));
  const Y=v=>H-8-(H-16)*((v-lo)/((hi-lo)||1));
  // 区分の境目を薄く引く
  bands().forEach(b=>{
    if(b.t<lo||b.t>hi||b.t<-90) return;
    const y=Y(b.t);
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.font='700 11px "BIZ UDGothic", sans-serif';
    ctx.fillText(b.name, 4, y-4);
  });
  // 帯
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath();
  m.forEach((x,i)=>{const px=X(i),py=Y(x.max); i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  for(let i=m.length-1;i>=0;i--) ctx.lineTo(X(i),Y(m[i].min));
  ctx.closePath(); ctx.fill();
  // 線
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath();
  m.forEach((x,i)=>{const px=X(i),py=Y(x.avg); i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.stroke();
  const last=m[m.length-1];
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(X(m.length-1),Y(last.avg),4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='700 11px "BIZ UDGothic", sans-serif';
  ctx.fillText(m[0].label, 0, H-1);
  const t=last.label;
  ctx.fillText(t, W-ctx.measureText(t).width, H-1);
}

setInterval(renderKiosk, 1000);
$('kiosk').onclick=()=>toggleKiosk(false);
$('setOverlay').onclick=e=>{ if(e.target===$('setOverlay')) $('setOverlay').classList.remove('on'); };

/* ---------- 操作 ---------- */
$('chart').addEventListener('mousemove', e=>{
  if(!cmap) return;
  const r=$('chart').getBoundingClientRect();
  const x=e.clientX-r.left;
  const {padL,padR,W,pts}=cmap;
  const frac=(x-padL)/Math.max(1,(W-padL-padR));
  const target=Math.min(1,Math.max(0,frac))*cmap.total;
  let best=0, bd=Infinity;
  pts.forEach((p,i)=>{ const d=Math.abs(p.p-target); if(d<bd){bd=d;best=i;} });
  hover=best;
  drawChart();
});
$('chart').addEventListener('mouseleave', ()=>{ hover=null; drawChart(); });

document.querySelectorAll('.tabs button[data-min]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    rangeMin=Number(b.dataset.min); spanMin=rangeMin;
    customFrom=customTo=null; $('customBox').style.display='none';
    hover=null; rangeData=null; loadRange();
  };
});
$('btnCustom').onclick=()=>{
  const box=$('customBox');
  const show=box.style.display!=='block';
  box.style.display=show?'block':'none';
  if(show && !$('cTo').value){
    const now=new Date(), ago=new Date(now.getTime()-6*3600*1000);
    const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
    $('cFrom').value=iso(ago); $('cTo').value=iso(now);
  }
};
$('cApply').onclick=()=>{
  if(!$('cFrom').value || !$('cTo').value) return;
  customFrom=new Date($('cFrom').value).toISOString();
  customTo=new Date($('cTo').value).toISOString();
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  $('btnCustom').classList.add('on');
  hover=null; rangeData=null; loadRange();
};
$('maOn').onchange=drawChart;
$('maN').onchange=drawChart;
$('rateOn').onchange=drawChart;

$('btnRefresh').onclick=load;
$('btnKiosk').onclick=()=>toggleKiosk(true);
$('btnFull').onclick=()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
$('btnSettings').onclick=()=>{
  const ov=$('setOverlay');
  const show = !ov.classList.contains('on');
  ov.classList.toggle('on', show);
  if(show){
    $('url').value=endpoint();
    $('thHi').value=cfg.hi===null?'':cfg.hi;
    $('thLo').value=cfg.lo===null?'':cfg.lo;
    $('deadMin').value=cfg.deadMin;
    $('pollSec').value=cfg.pollSec;
    $('bgOn').checked=!!cfg.bgOn;
    $('odoOn').checked=!!cfg.odo;
    drawBandRows();
  }
};
$('btnSave').onclick=()=>{
  const u=$('url').value.trim();
  if(u) localStorage.setItem(K_URL,u);
  const num=v=>{const t=parseFloat(v); return isFinite(t)?t:null;};
  cfg.hi=num($('thHi').value); cfg.lo=num($('thLo').value);
  const dm=parseFloat($('deadMin').value); cfg.deadMin=isFinite(dm)?dm:0;
  const ps=parseFloat($('pollSec').value); cfg.pollSec=isFinite(ps)&&ps>=2?ps:5;
  cfg.bgOn=$('bgOn').checked;
  cfg.odo=$('odoOn').checked;
  ['bigNum','kBigNum','allMax','allMin','cnt','h1max','h1min','h1avg','h1range','h1gap',
   'kTrend','kMax','kMin','kRange','kNext','kClock','ladderNextV'].forEach(id=>{
    const e=$(id); if(e){ e._slots=null; e._text=undefined; e._v=undefined; }
  });
  localStorage.setItem(K_SET, JSON.stringify(cfg));
  bgNow=''; applyBg(data?data.temp:NaN);
  $('setOverlay').classList.remove('on');
  restartPoll(); load(); loadRange();
};
$('btnBandReset').onclick=()=>{
  cfg.bands=BANDS_DEFAULT.map(b=>({...b}));
  localStorage.setItem(K_SET, JSON.stringify(cfg));
  drawBandRows(); bgNow=''; applyBg(data?data.temp:NaN);
};
$('bgOn').onchange=()=>{ cfg.bgOn=$('bgOn').checked; bgNow=''; applyBg(data?data.temp:NaN); };
$('btnNotify').onclick=async ()=>{
  if(typeof Notification==='undefined'){ $('btnNotify').textContent='通知は使えません'; return; }
  const p=await Notification.requestPermission();
  $('btnNotify').textContent = p==='granted'?'通知は許可済み':'許可されませんでした';
};
$('btnCsv').onclick=()=>{
  const m=(data&&data.minutes)?data.minutes:[];
  if(!m.length) return;
  let s='time,max,min,avg,ten_sec_values\n';
  m.slice().reverse().forEach(x=>{
    s+=x.label+','+f1(x.max)+','+f1(x.min)+','+f1(x.avg)+','+(x.cnt||0)+'\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));
  a.download='temp_minutes_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k==='r'){ load(); loadRange(); }
  else if(k==='f') $('btnFull').click();
  else if(k==='k') toggleKiosk();
  else if(k==='escape'){ toggleKiosk(false); $('setOverlay').classList.remove('on'); }
  else if(k>='1'&&k<='6'){
    const b=document.querySelectorAll('.tabs button[data-min]')[Number(k)-1];
    if(b) b.click();
  }
});

let rangeTick=0;
function restartPoll(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    if(document.hidden) return;
    load();
    // 長い期間ほど更新はゆっくりでよい
    const every = rangeMin<=60 ? 6 : rangeMin<=1440 ? 12 : 30;
    if(++rangeTick % every === 0 && !customFrom) loadRange();
  }, Math.max(2,cfg.pollSec)*1000);
}
setInterval(()=>{
  const left=Math.max(0, Math.ceil((nextAt-Date.now())/1000));
  $('countdown').textContent='次の更新 '+left+'s';
}, 500);
window.addEventListener('resize', ()=>{ drawChart(); drawSpark(); rebuildOdo(); });
// 書体の読み込み完了後にも作り直す（高さが変わるため）
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>rebuildOdo());
function rebuildOdo(){
  ['bigNum','kBigNum','allMax','allMin','cnt','h1max','h1min','h1avg','h1range','h1gap',
   'kTrend','kMax','kMin','kRange','kNext','kClock','ladderNextV','trVal'].forEach(id=>{
    const e=$(id); if(e){ e._slots=null; e._text=undefined; }
  });
  if(data) render();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });

// どの書体が実際に使われているか判定する
(function(){
  const el=$('fontNow'); if(!el) return;
  const test=document.createElement('span');
  test.style.cssText='position:absolute;visibility:hidden;font-size:64px';
  test.textContent='気温あア0123';
  document.body.appendChild(test);
  const widthOf=f=>{ test.style.fontFamily=f; return test.getBoundingClientRect().width; };
  const base=widthOf('serif');
  const cands=[['BIZ UDPゴシック','"BIZ UDPGothic", serif'],
               ['BIZ UDゴシック','"BIZ UDGothic", serif'],
               ['ヒラギノ角ゴ','"Hiragino Sans", serif'],
               ['游ゴシック','"Yu Gothic UI", serif']];
  let found='端末の既定ゴシック';
  for(const [name,stack] of cands){
    if(Math.abs(widthOf(stack)-base)>0.5){ found=name; break; }
  }
  test.remove();
  el.textContent=found;
})();

load();
loadRange();
restartPoll();
</script>
